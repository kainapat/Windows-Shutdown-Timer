<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq-title seq-desc">
        <title id="seq-title">Windows Shutdown Timer Sequence Diagram</title>
        <desc id="seq-desc">Sequence diagram illustrating time-ordered messages between User, Bento View, Application Controller, Windows Subsystem, and JSON Storage with ALT combined fragment for execution and cancellation branches.</desc>
        <defs>
          <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lifelines (Vertical Dashed Lines) -->
        <line x1="80" y1="76" x2="80" y2="480" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="280" y1="76" x2="280" y2="480" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="480" y1="76" x2="480" y2="480" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="680" y1="76" x2="680" y2="480" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="880" y1="76" x2="880" y2="480" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Activation Bars -->
        <rect x="76" y="96" width="8" height="76" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="276" y="96" width="8" height="376" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="476" y="112" width="8" height="360" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="676" y="176" width="8" height="24" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="876" y="196" width="8" height="24" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- Message 1: User -> View (Trigger Start) -->
        <line x1="84" y1="104" x2="276" y2="104" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="136" y="88" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="180" y="97" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Click Start / Preset</text>

        <!-- Message 2: View -> Controller (Call) -->
        <line x1="284" y1="124" x2="476" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="340" y="108" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="378" y="117" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">start_timer()</text>

        <!-- Message 3: Controller -> View (Confirm Prompt Return) -->
        <line x1="476" y1="144" x2="284" y2="144" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="330" y="128" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="378" y="137" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">QMessageBox.question()</text>

        <!-- Message 4: User -> Controller (Confirm Yes) -->
        <line x1="84" y1="164" x2="476" y2="164" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="236" y="148" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="278" y="157" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Confirm "Yes"</text>

        <!-- Message 5: Controller -> Windows OS (Headline Action) -->
        <line x1="484" y1="184" x2="676" y2="184" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="528" y="168" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="580" y="177" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">shutdown /s /t &lt;sec&gt;</text>

        <!-- Message 6: Controller -> Storage (Atomic JSON) -->
        <line x1="484" y1="204" x2="876" y2="204" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="632" y="188" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="680" y="197" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">save_settings() .tmp</text>

        <!-- Combined Fragment: ALT Frame -->
        <rect x="240" y="224" width="672" height="248" rx="4"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="240" y="224" width="40" height="16" rx="2"
              fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="260" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>

        <!-- Region 1: Countdown & Expiry -->
        <text x="252" y="254" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[Timer running &amp; expiry]</text>

        <!-- Self Loop on Controller: 1s Tick -->
        <path d="M 484,264 H 512 Q 520,264 520,272 V 280 Q 520,288 512,288 H 484"
              fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="528" y="278" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace">1s tick cadence</text>

        <!-- Controller -> View: Update Countdown -->
        <line x1="476" y1="304" x2="284" y2="304" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="332" y="288" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="378" y="297" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">update_countdown()</text>

        <!-- Controller -> View: Complete -->
        <line x1="476" y1="332" x2="284" y2="332" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="328" y="316" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="378" y="325" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Toast: "Executing..."</text>

        <!-- ALT Region Divider -->
        <line x1="248" y1="352" x2="904" y2="352" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>

        <!-- Region 2: Cancellation Branch -->
        <text x="252" y="370" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[User clicks Cancel]</text>

        <!-- User -> Controller (Cancel) -->
        <line x1="84" y1="392" x2="476" y2="392" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="236" y="376" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="278" y="385" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">cancel_timer()</text>

        <!-- Controller -> OS (Abort) -->
        <line x1="484" y1="412" x2="676" y2="412" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="532" y="396" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="580" y="405" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">shutdown /a</text>

        <!-- Controller -> Storage (Delete Config) -->
        <line x1="484" y1="432" x2="876" y2="432" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="632" y="416" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="680" y="425" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">_delete_config_file()</text>

        <!-- Controller -> View (Toast Cancelled) -->
        <line x1="476" y1="452" x2="284" y2="452" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="330" y="436" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="378" y="445" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">Toast: "Cancelled"</text>

        <!-- Actor Boxes at Top -->
        <!-- Actor 1: User -->
        <rect x="20" y="28" width="120" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="20" y="28" width="120" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="80" y="49" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Operator</text>
        <text x="80" y="63" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Desktop User</text>

        <!-- Actor 2: View -->
        <rect x="220" y="28" width="120" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="220" y="28" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="49" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PySide6 View</text>
        <text x="280" y="63" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Bento &amp; Hero Card</text>

        <!-- Actor 3: Focal Controller -->
        <rect x="420" y="28" width="120" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="420" y="28" width="120" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="480" y="49" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">App Controller</text>
        <text x="480" y="63" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ShutdownTimerApp</text>

        <!-- Actor 4: Windows Subsystem -->
        <rect x="620" y="28" width="120" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="620" y="28" width="120" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="680" y="49" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Windows OS</text>
        <text x="680" y="63" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">shutdown.exe</text>

        <!-- Actor 5: JSON Storage -->
        <rect x="820" y="28" width="120" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="820" y="28" width="120" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="880" y="49" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">JSON Store</text>
        <text x="880" y="63" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">timer_config.json</text>

        <!-- Legend Strip -->
        <line x1="36" y1="496" x2="924" y2="496" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="36" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <line x1="120" y1="510" x2="148" y2="510" stroke="#2d3142" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="156" y="512" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sync Call</text>

        <line x1="240" y1="510" x2="268" y2="510" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="276" y="512" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return Message</text>

        <line x1="396" y1="510" x2="424" y2="510" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="432" y="512" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Headline Success</text>

        <line x1="560" y1="510" x2="588" y2="510" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="596" y="512" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Atomic File I/O</text>

        <rect x="712" y="504" width="16" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="736" y="512" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">ALT Branch Frame</text>
      </svg>