<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" width="1280" height="720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="context-diagram-light-title context-diagram-light-desc">
<title id="context-diagram-light-title">Context Diagram</title>
<desc id="context-diagram-light-desc">DFD Context / Level 0 showing the application as one process with only external entities and boundary flows.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#52525B"/></marker>
<marker id="arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F43F5E"/></marker>
<marker id="arr-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0284C7"/></marker>
</defs>
<rect width="100%" height="100%" fill="#F4F4F5"/>
<text data-role="text" x="48" y="40" fill="#52525B" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="start" letter-spacing=".18em">CONTEXT DIAGRAM · DIAGRAM DESIGN</text>
<text data-role="text" x="48" y="76" fill="#18181B" font-family="'Instrument Serif',serif" font-size="28" font-weight="400" text-anchor="start">Windows Shutdown Timer</text>
<g transform="translate(0 100)">
<line data-role="connector" x1="220" y1="206" x2="430" y2="206" stroke="#0284C7" stroke-width="1.2" marker-end="url(#arr-link)"/><rect data-role="label-mask" x="272.5" y="181" width="105" height="14" rx="2" fill="#F4F4F5"/><text data-role="text" x="325.0" y="191" fill="#0284C7" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="middle" letter-spacing=".06em">CONTROL REQUEST</text><line data-role="connector" x1="430" y1="314" x2="220" y2="314" stroke="#52525B" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arr)"/><rect data-role="label-mask" x="286.5" y="289" width="77" height="14" rx="2" fill="#F4F4F5"/><text data-role="text" x="325.0" y="299" fill="#52525B" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="middle" letter-spacing=".06em">UI FEEDBACK</text><line data-role="connector" x1="850" y1="206" x2="1060" y2="206" stroke="#F43F5E" stroke-width="1.4" marker-end="url(#arr-accent)"/><rect data-role="label-mask" x="909.5" y="181" width="91" height="14" rx="2" fill="#F4F4F5"/><text data-role="text" x="955.0" y="191" fill="#F43F5E" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="middle" letter-spacing=".06em">POWER COMMAND</text><line data-role="connector" x1="1060" y1="314" x2="850" y2="314" stroke="#52525B" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arr)"/><rect data-role="label-mask" x="906.0" y="289" width="98" height="14" rx="2" fill="#F4F4F5"/><text data-role="text" x="955.0" y="299" fill="#52525B" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" text-anchor="middle" letter-spacing=".06em">COMMAND RESULT</text><rect data-role="node" x="40" y="180" width="180" height="160" rx="2" fill="#FFFFFF" stroke="#52525B" stroke-width="1.2"/><text data-role="text" x="130.0" y="212" fill="#18181B" font-family="'Geist',system-ui,sans-serif" font-size="14" font-weight="600" text-anchor="middle">Desktop User</text><text data-role="text" x="130.0" y="232" fill="#52525B" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" text-anchor="middle">external entity</text><rect data-role="node" x="430" y="154" width="420" height="200" rx="18" fill="#f43f5e" fill-opacity="0.08" stroke="#F43F5E" stroke-width="1.4"/><rect x="442" y="164" width="42" height="18" rx="2" fill="#F4F4F5" stroke="#F43F5E" stroke-opacity=".5" stroke-width=".8"/><text data-role="text" x="463" y="177" fill="#F43F5E" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="600" text-anchor="middle">0</text><text data-role="text" x="640.0" y="197" fill="#18181B" font-family="'Geist',system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="middle">Windows Shutdown Timer</text><text data-role="text" x="640.0" y="215" fill="#52525B" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="400" text-anchor="middle">single system process</text><rect data-role="node" x="1060" y="180" width="180" height="160" rx="2" fill="#FFFFFF" stroke="#52525B" stroke-width="1.2"/><text data-role="text" x="1150.0" y="212" fill="#18181B" font-family="'Geist',system-ui,sans-serif" font-size="14" font-weight="600" text-anchor="middle">Microsoft Windows</text><text data-role="text" x="1150.0" y="232" fill="#52525B" font-family="'Geist Mono',ui-monospace,monospace" font-size="9" font-weight="400" text-anchor="middle">external system</text><text data-role="text" x="640" y="396" fill="#71717A" font-family="'Instrument Serif',serif" font-size="12" font-weight="400" text-anchor="middle" font-style="italic">Control request = action/time/start/cancel · UI feedback = confirmation/status/countdown/error.</text><text data-role="text" x="640" y="418" fill="#71717A" font-family="'Instrument Serif',serif" font-size="12" font-weight="400" text-anchor="middle" font-style="italic">DFD Context / Level 0 · internal components and data stores intentionally omitted.</text><line x1="40" y1="588" x2="1240" y2="588" stroke="#18181b" stroke-opacity="0.18" stroke-width=".8"/><text data-role="text" x="40" y="612" fill="#52525B" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="600" text-anchor="start" letter-spacing=".18em">LEGEND</text><rect x="140" y="602" width="18" height="12" rx="2" fill="#f43f5e" fill-opacity="0.08" stroke="#F43F5E"/><text data-role="text" x="172" y="611" fill="#52525B" font-family="'Geist',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start">Process 0</text><line x1="304" y1="608" x2="328" y2="608" stroke="#0284C7" stroke-width="1.2" marker-end="url(#arr-link)"/><text data-role="text" x="336" y="611" fill="#52525B" font-family="'Geist',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start">External input</text><line x1="480" y1="608" x2="504" y2="608" stroke="#52525B" stroke-width="1.2" marker-end="url(#arr)"/><text data-role="text" x="512" y="611" fill="#52525B" font-family="'Geist',system-ui,sans-serif" font-size="9" font-weight="400" text-anchor="start">External output / result</text>
</g>
</svg>